<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>高千穂峡ボート 極速佔位小幫手</title>
  <style>
    :root {
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --primary-light: #e0f2fe;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #d97706;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      width: 440px;
      max-height: 580px;
      overflow-y: auto;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.4;
      padding: 12px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 8px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .header-icon {
      width: 32px;
      height: 32px;
      border-radius: 6px;
    }

    .header-title h1 {
      font-size: 15px;
      font-weight: 700;
      color: var(--primary);
    }

    .header-title p {
      font-size: 11px;
      color: var(--text-muted);
    }

    .mission-banner {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #fff;
      padding: 8px 10px;
      border-radius: var(--radius);
      font-size: 11px;
      line-height: 1.4;
      margin-bottom: 10px;
      box-shadow: 0 2px 4px rgba(2, 132, 199, 0.2);
    }

    .mission-banner strong {
      font-size: 12px;
      display: block;
      margin-bottom: 2px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      margin-bottom: 10px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }

    .card-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--primary);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .form-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .form-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      margin-bottom: 6px;
    }

    label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 3px;
    }

    .required::after {
      content: " *";
      color: var(--danger);
    }

    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      height: 30px;
      padding: 4px 8px;
      font-size: 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #fff;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--primary-light);
    }

    .url-actions {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }

    .btn-xs {
      height: 24px;
      padding: 0 8px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: #f1f5f9;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .btn-xs:hover {
      background: #e2e8f0;
    }

    .trigger-preview {
      background: #fefce8;
      border: 1px solid #fef08a;
      color: #854d0e;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 5px;
      cursor: pointer;
    }

    .checkbox-group input[type="checkbox"] {
      width: 14px;
      height: 14px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .checkbox-group span {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
    }

    details {
      margin-top: 4px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
      background: #f8fafc;
    }

    summary {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      outline: none;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 34px;
      border: none;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .status-msg {
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      padding: 4px;
      border-radius: 4px;
      display: none;
    }
    .status-msg.show {
      display: block;
    }
    .status-msg.success {
      background: #dcfce7;
      color: var(--success);
    }
    .status-msg.error {
      background: #fee2e2;
      color: var(--danger);
    }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="icon" class="header-icon">
    <div class="header-title">
      <h1>高千穂峡ボート 極速佔位助手</h1>
      <p>專注於毫秒鎖位 (hold_slot) • 取得 15 分鐘保留期</p>
    </div>
  </header>

  <div class="mission-banner">
    <strong>🎯 唯一核心目標：搶下席位 (仮押さえ)！</strong>
    只要搶先鎖定席位，系統將為您獨占保留整整 15 分鐘！後續資料輸入由您在桌面上從容填寫即可。
  </div>

  <!-- 1. 目標連結與船班設定 -->
  <div class="card">
    <div class="card-title">🔗 目標連結與預約時段</div>
    
    <div class="form-group">
      <label for="targetUrl" class="required">目標預約連結 (活動頁或日曆頁)</label>
      <input type="text" id="targetUrl" value="https://eipro.jp/takachiho1/events/view/EV00000007?closable=1&service_cd=6892dd9d-5b54-4202-bd1d-4aa6c0a8018d&service_session_cd=68a916a6-59c8-459d-9643-a231c0a8018d&service_start_datetime=2026/11/07%2008:30:00&service_end_datetime=2026/11/07%2009:00:00" placeholder="https://eipro.jp/takachiho1/events/view/EV00000007?closable=1&service_cd=6892dd9d-5b54-4202-bd1d-4aa6c0a8018d&service_session_cd=68a916a6-59c8-459d-9643-a231c0a8018d&service_start_datetime=2026/11/07%2008:30:00&service_end_datetime=2026/11/07%2009:00:00">
      <div class="url-actions">
        <button type="button" class="btn-xs" id="btnUseCurrentUrl">📍 抓取當前分頁網址</button>
        <button type="button" class="btn-xs" id="btnGoTargetUrl">🌐 開啟此目標網址</button>
      </div>
      <div class="url-actions" style="margin-top: 6px;">
        <button type="button" class="btn-xs" id="btnPreset1026" style="background: #fef3c7; color: #92400e; border-color: #fde68a;">🧪 帶入 10/26 實測時段 (明天開賣)</button>
        <button type="button" class="btn-xs" id="btnPreset1107" style="background: #e0f2fe; color: #0369a1; border-color: #bae6fd;">🎯 帶入 11/07 正式搶票</button>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group" style="flex: 1.4;">
        <label for="targetDate" class="required">目標日期</label>
        <input type="text" id="targetDate" placeholder="YYYY/MM/DD" value="2026/11/07">
      </div>
      <div class="form-group" style="flex: 1.2;">
        <label for="targetTime" class="required">目標時段</label>
        <select id="targetTime">
          <option value="08:30:00" selected>08:30 - 09:00</option>
          <option value="09:00:00">09:00 - 09:30</option>
          <option value="09:30:00">09:30 - 10:00</option>
          <option value="10:00:00">10:00 - 10:30</option>
          <option value="10:30:00">10:30 - 11:00</option>
          <option value="11:00:00">11:00 - 11:30</option>
          <option value="11:30:00">11:30 - 12:00</option>
          <option value="12:00:00">12:00 - 12:30</option>
          <option value="12:30:00">12:30 - 13:00</option>
          <option value="13:00:00">13:00 - 13:30</option>
          <option value="13:30:00">13:30 - 14:00</option>
          <option value="14:00:00">14:00 - 14:30</option>
          <option value="14:30:00">14:30 - 15:00</option>
          <option value="15:00:00">15:00 - 15:30</option>
          <option value="15:30:00">15:30 - 16:00</option>
          <option value="16:00:00">16:00 - 16:30</option>
          <option value="16:30:00">16:30 - 17:00</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="adultCount" class="required">大人人數 (上限3)</label>
        <select id="adultCount">
          <option value="1">1 名</option>
          <option value="2" selected>2 名</option>
          <option value="3">3 名</option>
        </select>
      </div>
      <div class="form-group">
        <label for="childCount">幼兒人數 (未就學)</label>
        <select id="childCount">
          <option value="0" selected>0 名</option>
          <option value="1">1 名</option>
        </select>
      </div>
    </div>
  </div>

  <!-- 2. 極速波浪搶位設定 (核心引擎) -->
  <div class="card">
    <div class="card-title">⚡ 搶位時機與安全重試設定</div>

    <div class="form-row">
      <div class="form-group" style="flex: 1.2;">
        <label for="launchBaseTime" class="required">開賣時間 (台灣)</label>
        <input type="text" id="launchBaseTime" value="08:00:00" placeholder="08:00:00">
      </div>
      <div class="form-group" style="flex: 1.5;">
        <label for="earlyBufferMs" class="required">提前發送時間 (精準抵達)</label>
        <select id="earlyBufferMs">
          <option value="15" selected>提前 15 毫秒 (07:59:59.985 - 🎯 推薦！抵達 08:00:00.005)</option>
          <option value="20">提前 20 毫秒 (07:59:59.980 - 抵達約 08:00:00.000)</option>
          <option value="30">提前 30 毫秒 (07:59:59.970)</option>
          <option value="50">提前 50 毫秒 (07:59:59.950)</option>
          <option value="100">提前 100 毫秒 (07:59:59.900)</option>
          <option value="200">提前 200 毫秒 (07:59:59.800)</option>
        </select>
      </div>
    </div>

    <div class="trigger-preview" id="triggerPreview">
      🎯 首發發動時間：07:59:59.985（於 08:00:00.005 抵達伺服器，若未開則以 250ms 溫和重送）
    </div>

    <label class="checkbox-group">
      <input type="checkbox" id="autoHold" checked>
      <span>到達時間精準鎖位 (hold_slot 鎖定 15 分鐘，以 250ms 安全重試)</span>
    </label>

    <label class="checkbox-group">
      <input type="checkbox" id="autoClickStatement" checked>
      <span>若在活動頁偵測到「予約手続き」按鈕出現，立即毫秒自動點擊</span>
    </label>
  </div>

  <!-- 3. 選填備份 (僅供參考/快速複製，不影響搶位) -->
  <details>
    <summary>📋 選填：個人資料備忘 (方便在預約頁面一鍵複製)</summary>
    <div style="margin-top: 8px;">
      <div class="form-row">
        <div class="form-group">
          <label for="lName">代表者 姓</label>
          <input type="text" id="lName" placeholder="例如：王 或 WANG">
        </div>
        <div class="form-group">
          <label for="fName">代表者 名</label>
          <input type="text" id="fName" placeholder="例如：大明 或 DAMING">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="tel">聯絡手機</label>
          <input type="text" id="tel" placeholder="+886912345678">
        </div>
        <div class="form-group">
          <label for="email">電子信箱</label>
          <input type="text" id="email" placeholder="example@gmail.com">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="cardNumber">信用卡卡號 (備忘)</label>
          <input type="text" id="cardNumber" placeholder="4111222233334444">
        </div>
      </div>
    </div>
  </details>

  <div class="status-msg" id="statusMsg"></div>

  <div class="actions">
    <button type="button" class="btn btn-primary" id="btnSave">💾 儲存搶位設定</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
