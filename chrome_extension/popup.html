<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>高千穂峡ボート 預約小幫手</title>
  <style>
    :root {
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --primary-light: #e0f2fe;
      --success: #16a34a;
      --danger: #dc2626;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      width: 440px;
      max-height: 580px;
      overflow-y: auto;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.4;
      padding: 12px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 10px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .header-icon {
      width: 32px;
      height: 32px;
      border-radius: 6px;
    }

    .header-title h1 {
      font-size: 15px;
      font-weight: 700;
      color: var(--primary);
    }

    .header-title p {
      font-size: 11px;
      color: var(--text-muted);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      margin-bottom: 10px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }

    .card-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--primary);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .form-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .form-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      margin-bottom: 6px;
    }

    label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 3px;
    }

    .required::after {
      content: " *";
      color: var(--danger);
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="number"],
    select {
      width: 100%;
      height: 30px;
      padding: 4px 8px;
      font-size: 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #fff;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--primary-light);
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      cursor: pointer;
    }

    .checkbox-group input[type="checkbox"] {
      width: 14px;
      height: 14px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .checkbox-group span {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
    }

    .privacy-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #f1f5f9;
      border-radius: 4px;
      padding: 6px 8px;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 6px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 34px;
      border: none;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: #e2e8f0;
      color: #334155;
    }
    .btn-secondary:hover {
      background: #cbd5e1;
    }

    .btn-success {
      background: var(--success);
      color: #fff;
    }

    .status-msg {
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      padding: 4px;
      border-radius: 4px;
      display: none;
    }
    .status-msg.show {
      display: block;
    }
    .status-msg.success {
      background: #dcfce7;
      color: var(--success);
    }
    .status-msg.error {
      background: #fee2e2;
      color: var(--danger);
    }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="icon" class="header-icon">
    <div class="header-title">
      <h1>高千穂峡ボート 預約助手</h1>
      <p>自動鎖位 (hold_slot) • 自動填表 • 3D 驗證警報</p>
    </div>
  </header>

  <!-- 1. 預約時段設定 -->
  <div class="card">
    <div class="card-title">🎯 預約時段設定</div>
    <div class="form-row">
      <div class="form-group" style="flex: 1.4;">
        <label for="targetDate" class="required">目標日期</label>
        <input type="text" id="targetDate" placeholder="YYYY/MM/DD" value="2026/11/07">
      </div>
      <div class="form-group" style="flex: 1.2;">
        <label for="targetTime" class="required">船班時段</label>
        <select id="targetTime">
          <option value="08:30:00" selected>08:30 - 09:00</option>
          <option value="09:00:00">09:00 - 09:30</option>
          <option value="09:30:00">09:30 - 10:00</option>
          <option value="10:00:00">10:00 - 10:30</option>
          <option value="10:30:00">10:30 - 11:00</option>
          <option value="11:00:00">11:00 - 11:30</option>
          <option value="11:30:00">11:30 - 12:00</option>
          <option value="12:00:00">12:00 - 12:30</option>
          <option value="12:30:00">12:30 - 13:00</option>
          <option value="13:00:00">13:00 - 13:30</option>
          <option value="13:30:00">13:30 - 14:00</option>
          <option value="14:00:00">14:00 - 14:30</option>
          <option value="14:30:00">14:30 - 15:00</option>
          <option value="15:00:00">15:00 - 15:30</option>
          <option value="15:30:00">15:30 - 16:00</option>
          <option value="16:00:00">16:00 - 16:30</option>
          <option value="16:30:00">16:30 - 17:00</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="adultCount" class="required">大人人數 (上限3)</label>
        <select id="adultCount">
          <option value="1">1 名</option>
          <option value="2" selected>2 名</option>
          <option value="3">3 名</option>
        </select>
      </div>
      <div class="form-group">
        <label for="childCount">幼兒人數 (未就學)</label>
        <select id="childCount">
          <option value="0" selected>0 名</option>
          <option value="1">1 名</option>
        </select>
      </div>
      <div class="form-group" style="flex: 1.2;">
        <label for="launchTime">開搶啟動時間 (台灣)</label>
        <input type="text" id="launchTime" value="07:59:59.500" placeholder="07:59:59.500">
      </div>
    </div>

    <label class="checkbox-group">
      <input type="checkbox" id="autoHold" checked>
      <span>啟動時自動搶先鎖定席位 (hold_slot 鎖定 15 分鐘)</span>
    </label>

    <label class="checkbox-group">
      <input type="checkbox" id="autoFill" checked>
      <span>進入預約表單 (orders/add) 後自動填入所有資料</span>
    </label>

    <label class="checkbox-group">
      <input type="checkbox" id="autoSubmit" checked>
      <span>填表完成後自動點擊送出前往確認頁面</span>
    </label>
  </div>

  <!-- 2. 代表者個人資料 -->
  <div class="card">
    <div class="card-title">👤 代表者個人資料</div>
    <div class="form-row">
      <div class="form-group">
        <label for="lName" class="required">姓 (漢字/護照英文)</label>
        <input type="text" id="lName" placeholder="例如：王 或 WANG">
      </div>
      <div class="form-group">
        <label for="fName" class="required">名 (漢字/護照英文)</label>
        <input type="text" id="fName" placeholder="例如：大明 或 DAMING">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="lNameKana" class="required">姓 フリガナ (片假名)</label>
        <input type="text" id="lNameKana" placeholder="例如：ワン">
      </div>
      <div class="form-group">
        <label for="fNameKana" class="required">名 フリガナ (片假名)</label>
        <input type="text" id="fNameKana" placeholder="例如：ダイミン">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="email" class="required">電子郵件信箱</label>
        <input type="email" id="email" placeholder="接收預約確認與通知信">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="tel" class="required">聯絡手機</label>
        <input type="text" id="tel" placeholder="例如：+886912345678">
      </div>
      <div class="form-group">
        <label for="birthday" class="required">出生年月日</label>
        <input type="text" id="birthday" placeholder="YYYY/MM/DD">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group" style="flex: 1;">
        <label for="zip" class="required">郵遞區號</label>
        <input type="text" id="zip" value="882-1101">
      </div>
      <div class="form-group" style="flex: 2;">
        <label for="address" class="required">日本住址 / 住宿飯店</label>
        <input type="text" id="address" value="宮崎県西臼杵郡高千穂町大字三田井御塩井">
      </div>
    </div>
  </div>

  <!-- 3. 信用卡資料 -->
  <div class="card">
    <div class="card-title">💳 信用卡付款 (PayJP 閘道)</div>
    <div class="form-row">
      <div class="form-group">
        <label for="cardNumber" class="required">卡號 (16 碼)</label>
        <input type="text" id="cardNumber" placeholder="4111222233334444" maxlength="19">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="expMonth" class="required">到期月 (MM)</label>
        <select id="expMonth">
          <option value="01">01</option>
          <option value="02">02</option>
          <option value="03">03</option>
          <option value="04">04</option>
          <option value="05">05</option>
          <option value="06">06</option>
          <option value="07">07</option>
          <option value="08">08</option>
          <option value="09">09</option>
          <option value="10">10</option>
          <option value="11">11</option>
          <option value="12">12</option>
        </select>
      </div>
      <div class="form-group">
        <label for="expYear" class="required">到期年 (YY)</label>
        <select id="expYear">
          <option value="25">2025 (25)</option>
          <option value="26">2026 (26)</option>
          <option value="27">2027 (27)</option>
          <option value="28" selected>2028 (28)</option>
          <option value="29">2029 (29)</option>
          <option value="30">2030 (30)</option>
          <option value="31">2031 (31)</option>
          <option value="32">2032 (32)</option>
          <option value="33">2033 (33)</option>
          <option value="34">2034 (34)</option>
          <option value="35">2035 (35)</option>
        </select>
      </div>
      <div class="form-group">
        <label for="cvc" class="required">安全碼 (CVC)</label>
        <input type="password" id="cvc" placeholder="3或4碼" maxlength="4">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="cardHolder">持卡人英文姓名</label>
        <input type="text" id="cardHolder" placeholder="例如：DAMING WANG">
      </div>
    </div>

    <div class="privacy-badge">
      🔒 隱私保護：所有個人與信用卡資料僅安全保存在本機 Chrome 儲存空間，絕不對外傳輸。
    </div>
  </div>

  <div class="status-msg" id="statusMsg"></div>

  <div class="actions">
    <button type="button" class="btn btn-primary" id="btnSave">💾 儲存所有預約設定</button>
    <button type="button" class="btn btn-secondary" id="btnOpenCalendar">🌐 開啟高千穂峽預約日曆</button>
    <button type="button" class="btn btn-secondary" id="btnTestAutofill">🧪 立即在當前分頁測試填表</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
